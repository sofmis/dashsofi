 box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 0 -14px 26px rgba(0,0,0,.06),1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 5px 0 var(--edge),10px 18px 26px var(--shadow)}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.14) 100%);z-index:4}

 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff) 0,var(--c) 40%,color-mix(in srgb,var(--c) 72%,#4A5262) 100%);box-shadow:inset 6px 0 14px rgba(255,255,255,.22),inset -8px 0 14px rgba(0,0,0,.16)}

async function analyzeZip(file){
  if(!window.JSZip)throw new Error("No se pudo cargar el lector de ZIP. Revisa tu conexión.");

  const top=names[0].split("/")[0];

  const a={zipName:file.name||"proyecto.zip",zipSize:zsize,files:0,skipped:0,bytes:0,loc:0,todos:0,langs:{},manifests:[],deps:[],devDeps:0,scripts:[],pyDeps:[],readme:"",tests:false,license:false,gitignore:false,docker:false,ci:false,envFiles:[],secrets:[],risks:{},largest:[],dirs:{},rootFiles:[],pkgName:""};
  let budget=30*1048576;
  for(let i=0;i<entries.length;i++){
    const e=entries[i],path=names[i].slice(root.length);
    if(!path)continue;
    if(SKIPD.test(path)){a.skipped++;continue}
    const size=(e._data&&e._data.uncompressedSize)||0,base=path.split("/").pop(),low=base.toLowerCase(),ext=low.includes(".")?low.split(".").pop():"",lang=LANG[ext];
    a.files++;a.bytes+=size;a.largest.push([path,size]);
    const parts=path.split("/");if(parts.length>1)a.dirs[parts[0]]=(a.dirs[parts[0]]||0)+1;else a.rootFiles.push(base);
    if(/^(tests?|__tests__|spec)$/i.test(parts[0])||/(^|\/)(tests?|__tests__)\//i.test(path)||/\.(test|spec)\.\w+$/.test(low)||/^test_.*\.py$/.test(low))a.tests=true;
    if(/^license/.test(low))a.license=true;
    if(low===".gitignore")a.gitignore=true;
    if(low==="dockerfile"||/^docker-compose/.test(low))a.docker=true;
    if(/(^|\/)\.github\/workflows\//.test(path)||low===".gitlab-ci.yml")a.ci=true;
    if(/^\.env(\.|$)/.test(low)&&!/example|sample|template/.test(low))a.envFiles.push(path);
    if(["package.json","requirements.txt","pyproject.toml","cargo.toml","go.mod","pom.xml","build.gradle","composer.json","gemfile"].includes(low))a.manifests.push(path);
    const canRead=!BINX.test(low)&&size<=524288&&budget>0&&(lang||["dockerfile",".gitignore","requirements.txt","license"].includes(low)||/^\.env/.test(low));
    if(!canRead)continue;
    let t="";try{t=await e.async("string")}catch(_){continue}
    budget-=t.length;

  return html`<div class="overlay" onClick=${onClose}><div class="modal wide" role="dialog" aria-label=${"Informe de "+p.name} onClick=${e=>e.stopPropagation()}>
    <h2>Informe técnico: ${p.name}</h2>
    <p class="rnote">Se arma con los datos del proyecto y del reporte del ZIP. Lo que dejes vacío se redacta automáticamente con lo que se sabe del proyecto, sin inventar cifras.${p.report?"":" Sube el ZIP desde 'Reporte' para que el informe incluya el stack y las métricas del código."}</p>
    <div class="irow">${T("version","Versión final","v1.0.0")}${T("team","Desarrolladores","Tu nombre o tu equipo")}</div>
    ${A("summary","Resumen ejecutivo (opcional)",3,"Vacío = se redacta solo")}
    ${A("entregables","Entregables, uno por línea: Módulo | Estado inicial | Resultado final",3,"Autenticación | Requerido | Implementada con JWT")}
    ${A("metrics","Métricas extra, una por línea",2,"Cobertura de pruebas: 87%")}
    ${A("deploy","Guía de despliegue (opcional)",4,"Vacío = se genera según el stack detectado")}
    <h3 class="rsec" style=${{margin:"4px 0 0"}}>GitHub</h3>
    ${T("gh","URL del repositorio","https://github.com/usuario/repositorio")}
    <label class="chk"><input type="checkbox" checked=${f.ghCv} onChange=${e=>set("ghCv",e.target.checked)}/>Mostrar el enlace de GitHub en mi currículum</label>
    <p class="rnote">Esta página no puede subir archivos a GitHub por ti (necesitaría tu cuenta). Genera el INFORME.md ya con el formato listo y súbelo a tu repositorio; el enlace se guarda aquí y se muestra en tu currículum.</p>
    ${err&&html`<p class="rerr" role="alert">${err}</p>`}${msg&&html`<p class="rnote" role="status">${msg}</p>`}
    <div class="row" style=${{justifyContent:"flex-end"}}>
      <button type="button" class="btn ghost" onClick=${onClose}>Cerrar</button>
      <button type="button" class="btn ghost" disabled=${busy} onClick=${()=>run("md")}>Generar para GitHub (.md)</button>
      <button type="button" class="btn" disabled=${busy} onClick=${()=>run("pdf")}>Generar PDF y añadir al currículum</button>
    </div>
  </div></div>`;
}

function App(){
  const [items,setItems]=useState(load);
  const [page,setPage]=useState("dashboard");
  const [filter,setFilter]=useState("Todos");
  const [modal,setModal]=useState(false);
  const [courses,setCourses]=useState(loadC);
  const [cm,setCm]=useState(null);
  const [cv,setCv]=useState(loadCV);
  const [cvm,setCvm]=useState(false);
  const [rid,setRid]=useState(null);
  const [iid,setIid]=useState(null);
  const [theme,setTheme]=useState(()=>{try{const t=localStorage.getItem("tema-v1");if(t)return t}catch(e){}return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"});
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);try{localStorage.setItem("tema-v1",theme)}catch(e){}},[theme]);
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}},[items]);
  useEffect(()=>{try{localStorage.setItem(CK,JSON.stringify(courses))}catch(e){}},[courses]);
  useEffect(()=>{try{localStorage.setItem(CVK,JSON.stringify(cv))}catch(e){}},[cv]);
  const pin=id=>setItems(a=>a.map(x=>x.id===id?{...x,pinned:!x.pinned}:x));
  const prog=(id,v)=>setItems(a=>a.map(x=>x.id===id?{...x,progress:v}:x));
  const color=(id,v)=>setItems(a=>a.map(x=>x.id===id?{...x,color:v}:x));
  const del=id=>setItems(a=>a.filter(x=>x.id!==id));
  const patch=(id,o)=>setItems(a=>a.map(x=>x.id===id?{...x,...o}:x));
  const saveRep=(id,rep)=>setItems(a=>a.map(x=>x.id===id?{...x,report:rep}:x));
  const save=f=>{setItems(a=>a.map(x=>x.id===f.id?{...x,...f}:x));setModal(false)};
  const add=p=>{setItems(a=>[...a,{...p,id:Date.now(),pinned:false}]);setModal(false);setPage("proyectos")};
  const pinned=items.filter(x=>x.pinned);
  const avg=items.length?Math.round(items.reduce((s,x)=>s+x.progress,0)/items.length):0;
  const done=items.filter(x=>x.progress>=100).length;
  const list=page==="proyectos"&&filter!=="Todos"?items.filter(x=>x.cat===filter):items;
  const sorted=[...list].sort((a,b)=>b.pinned-a.pinned);
  const [bk,setBk]=useState("");
  const exportAll=async()=>{setBk("");try{await saveFile("respaldo-dashboard.json",JSON.stringify({v:1,items,courses,cv}));setBk("Copia lista.")}catch(x){if(!x||x.code!=="declined")setBk("No se pudo guardar la copia.")}};
  const importAll=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text()),okI=x=>x&&typeof x==="object"&&typeof x.name==="string";
    if(Array.isArray(j.items))setItems(j.items.filter(okI).map(x=>({...x,id:x.id||Date.now()+Math.random(),progress:Math.max(0,Math.min(100,+x.progress||0))})));
    if(Array.isArray(j.courses))setCourses(j.courses.filter(okI).map(x=>({...x,days:Array.isArray(x.days)?x.days:[],cols:Array.isArray(x.cols)&&x.cols.length>=3?x.cols:pick3(),progress:Math.max(0,Math.min(100,+x.progress||0))})));
    if(j.cv&&typeof j.cv==="object")setCv({...cvSeed,...j.cv});setBk("Datos importados.")}catch(x){setBk("El archivo no es una copia válida.")}};
  const toggleTheme=()=>setTheme(t=>t==="dark"?"light":"dark");
  const C=2*Math.PI*40;
  return html`<div class="app">
    <aside class="side">
      <div class="brand"><span class="logo">M</span>Mis proyectos</div>
      <nav class="nav grp" aria-label="Fijados"><h4>Fijados</h4>
        ${pinned.length?pinned.map(p=>html`<button key=${p.id} onClick=${()=>setPage("proyectos")}><span class="dot" style=${{background:p.color}}></span>${p.name}<span class="pct">${p.progress}%</span></button>`):html`<p class="empty-s">Fija un proyecto con el botón de la chincheta.</p>`}
      </nav>
      <nav class="nav grp" aria-label="Páginas"><h4>Páginas</h4>
        <button class=${page==="dashboard"?"on":""} onClick=${()=>setPage("dashboard")}>▦ Dashboard</button>
        <button class=${page==="proyectos"?"on":""} onClick=${()=>setPage("proyectos")}>◈ Proyectos</button>
        <button class=${page==="cursos"?"on":""} onClick=${()=>setPage("cursos")}>◐ Cursos</button>
        <button class=${page==="curriculum"?"on":""} onClick=${()=>setPage("curriculum")}>▤ Currículum</button>
      </nav>
      <div class="grp" style=${{display:"flex",flexDirection:"column",gap:"6px",marginTop:"auto"}}>
        <button class="theme" style=${{marginTop:0}} onClick=${exportAll}>Exportar copia de mis datos</button>
        <label class="theme" style=${{marginTop:0,textAlign:"center",cursor:"pointer"}}>Importar copia<input type="file" accept=".json,application/json" hidden onChange=${importAll}/></label>
        ${bk&&html`<small role="status" style=${{fontSize:"11px",color:"var(--muted)",padding:"0 4px"}}>${bk}</small>`}
      </div>
      <button class="theme" style=${{marginTop:0}} onClick=${toggleTheme}>Cambiar tema</button>
    </aside>
    <main class=${page==="cursos"?"bleed":""}>
      ${page==="cursos"&&html`<${Cursos} courses=${courses} setCourses=${setCourses} onNew=${()=>setCm({mode:"new"})} onEdit=${c=>setCm({mode:"edit",data:c})}/>`}
      ${page==="curriculum"&&html`<${Curriculum} items=${items} courses=${courses} cv=${cv} onEdit=${()=>setCvm(true)}/>`}
      ${(page==="dashboard"||page==="proyectos")&&html`<div class="top">
        <h1>${page==="dashboard"?"Dashboard":"Proyectos"}</h1>
        <button class="btn" onClick=${()=>setModal(true)}>+ Nuevo proyecto</button>
      </div>`}
      ${page==="dashboard"&&html`<section class="summary" aria-label="Resumen">
        <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C*(1-avg/100)} style=${{transition:"stroke-dashoffset .8s"}}/></svg><b>${avg}%</b></div>
        <div class="stats"><div><b>${items.length}</b><span>Proyectos</span></div><div><b>${done}</b><span>Terminados</span></div><div><b>${items.filter(x=>x.cat==="Ciberseguridad").length}</b><span>Ciberseguridad</span></div><div><b>${items.filter(x=>x.cat==="Programación").length}</b><span>Programación</span></div></div>
      </section>`}
      ${page==="proyectos"&&html`<div class="chips" style=${{marginBottom:"20px"}}>${["Todos",...CATS].map(c=>html`<button class="chip" aria-pressed=${filter===c} onClick=${()=>setFilter(c)}>${c}</button>`)}</div>`}
      ${(page==="dashboard"||page==="proyectos")&&html`<section class="grid">
        ${sorted.length?sorted.map(p=>html`<${Card} key=${p.id} p=${p} onPin=${pin} onProg=${prog} onDel=${del} onColor=${color} onEdit=${p=>setModal(p)} onReport=${p=>setRid(p.id)} onInforme=${p=>setIid(p.id)}/>`):html`<div class="blank">Aún no hay proyectos. Crea el primero con “Nuevo proyecto”.</div>`}
      </section>`}
    </main>
    ${iid&&items.find(x=>x.id===iid)&&html`<${InformeModal} p=${items.find(x=>x.id===iid)} onClose=${()=>setIid(null)} onSave=${patch}/>`}
    ${rid&&items.find(x=>x.id===rid)&&html`<${ReportModal} p=${items.find(x=>x.id===rid)} onClose=${()=>setRid(null)} onSave=${saveRep}/>`}
    ${cvm&&html`<${CVModal} init=${cv} onClose=${()=>setCvm(false)} onSave=${f=>{setCv(f);setCvm(false)}}/>`}
    ${cm&&html`<${CourseModal} init=${cm.mode==="edit"?cm.data:null} onClose=${()=>setCm(null)} onSave=${f=>{if(cm.mode==="edit")setCourses(a=>a.map(x=>x.id===f.id?f:x));else setCourses(a=>[...a,{...f,id:Date.now()}]);setCm(null)}}/>`}
    ${modal&&html`<${ProjectModal} init=${modal===true?null:modal} onClose=${()=>setModal(false)} onSave=${f=>modal===true?add(f):save(f)}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
